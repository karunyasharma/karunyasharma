name: Generate Arcade Contribution Graphs

on:
  schedule:
    - cron: "0 */24 * * *"   # runs automatically every 24 hours
  workflow_dispatch:            # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # comma-separated list of games — matches the README (pacman + bomberman)
          games: 'pacman,bomberman'

      - name: push SVGs to the output-arcade branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-arcade
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
